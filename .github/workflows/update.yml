name: 매크로 지표 자동 업데이트

on:
  schedule:
    # GitHub 예약 실행은 혼잡 시 3.5~7.5시간 늦게 시작됨(2026-11 실측) → 아침 7시(KST) 전에 끝나도록
    # 밤 23:17 KST로 예약. 정각은 혼잡이 심해 17분으로 피함. 미국 지표(22:30 KST 발표)도 반영됨.
    - cron: "17 14 * * *"  # UTC 14:17 = KST 23:17
  workflow_dispatch:
    inputs:
      force_news:
        description: "뉴스 연결을 이전 결과 없이 전부 다시 판단"
        type: boolean
        default: false

permissions:
  contents: write

# 사람 판정 반영(review.yml)과 동시에 데이터 파일을 쓰지 않도록 한 줄로 세운다
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 설치
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: collect.py 실행 (export.py 자동 연결)
        id: collect
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python3 collect.py | tee /tmp/collect_output.log

      - name: Node 설치 (Claude Code CLI용)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Claude Code CLI 설치
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code@2.1.331

      - name: 같은 시기 뉴스 연결 (news_collect.py)
        # 뉴스는 부가 기능이라 실패해도 지표 업데이트는 계속한다
        # AI는 Claude 구독 토큰(claude setup-token, 1년 유효)으로 돌린다 — API 과금 없음
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_AUTOUPDATER: "1"
          NEWS_FORCE: ${{ inputs.force_news && '1' || '' }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python3 news_collect.py

      - name: 변경 여부 확인
        id: diff
        run: |
          if git diff --quiet -- 매크로_트래커_로우데이터.xlsx site/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 추가된 행 수 추출
        id: rows
        if: steps.diff.outputs.changed == 'true'
        run: |
          n=$(grep -oE '=== 수집 결과: [0-9]+개 행 추가 ===' /tmp/collect_output.log | grep -oE '[0-9]+' || echo "0")
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: 커밋 및 푸시
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 매크로_트래커_로우데이터.xlsx site/data
          git commit -m "chore: 매크로 지표 자동 업데이트 $(date -u +%Y-%m-%d) (신규 ${{ steps.rows.outputs.count }}행)"
          git push
