name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["매크로 지표 자동 업데이트", "사람 판정 반영"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 업로드와 배포를 별도 job으로 나눈다. 한 job 안에서 연달아 실행하면
  # 배포 단계가 방금 올린 artifact를 아직 못 찾는 경우가 있었다(2026-11-23, 11-24).
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Pages 설정
        uses: actions/configure-pages@v6

      - name: site/ 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v5
